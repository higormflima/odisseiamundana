project_id: fiat-ducato-1997
title: Camper FIAT Ducato
summary: Nosso camper Fiat Ducato de 1997, uma nova casa sobre rodas para nossas aventuras na Europa.
vehicle_model: Fiat Ducato 1997
chassis: Motor 1.9 diesel e câmbio manual de cinco marchas.
notes: >-
  Ficha recebida em 2026: comprimento de 6,0 m, altura de 3,10 m,
  massa máxima autorizada de 2.800 kg, cinco lugares registrados e
  144.932 km na data da ficha. Inspeção técnica em 05/10/2026.
  Manutenção informada: correia dentada aos 101.000 km; troca de óleo em
  01/09/2025 aos 142.677 km; reparos nos freios, suspensão dianteira e
  bomba de água. Dados fornecidos pelo vendedor, pendentes de conferência.
  Outros dados da ficha ainda não confirmados: colchão de 140 × 200 cm e
  escada de madeira; geladeira Electrolux com congelador, três sensores de gás
  e fumaça e botijão de propano de 11 litros; cassete Thetford de 20 litros;
  painel JaSolar Tiger Neo N-type de 440 Wp, 108 células e 1.762 × 1.134 × 30 mm;
  controlador Volt Polska SOL MPPT para 12 ou 24 V; bateria Green Cell AGM32
  VRLA de 12 V e 1.800 Wh; bateria de partida Jenox Gold de 12 V e 95 Ah;
  inversor Victron Energy Phoenix de 12 V e 1200 VA com onda senoidal pura.
