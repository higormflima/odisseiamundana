      - Caixa de água servida Seaflo.
      - Medidores de nível de água.
      - Bomba pressurizada Matsuri.
      - Reservatório de água servida de 70 litros.
    materials:
      - Mangueiras flexíveis.
    processes:
      - Instalação das mangueiras e dos medidores de nível.
      - Instalação da caixa de água servida para auxiliar o escoamento.
  - system_id: gas
    title: Sistema de gás
    video_ids: [8Y2hkStLF14, wuOiO7XYDgQ]
    materials:
      - Mangueiras para instalação de gás.
    equipment:
