  - system_id: planning
    title: Planejamento e projeto 3D
    video_ids: [NFc-9WhVAIY, jWKbwh202hg, 1asypqExBhA, qukRFG4Uxmw, 9b_Pe5VWjAU, CTWd2t3xvYA]
    technologies:
      - SketchUp
    processes:
      - Desenho 3D da distribuição interna da van.
      - Organização dos custos da construção em planilha.
  - system_id: thermal-insulation
    title: Isolamento térmico e acústico
    video_ids: [pBVVlorqkBU]
    materials:
      - Material similar ao 3TC, sem marca confirmada.
      - Lã de rocha nos locais de difícil acesso.
  - system_id: flooring
    title: Piso e assoalho
    video_ids: [WBOeLFDTGbo]
    materials:
      - Madeira para o piso.
      - Revestimento em piso vinílico.
    processes:
      - Recuperação do assoalho metálico, com retirada de ferrugem e soldagem.
      - Preparação e montagem do piso de madeira, com corte, encaixe e verniz.
      - Acabamento com piso vinílico.
  - system_id: windows
    title: Janelas
    video_ids: [lM10PvYTkGA, yRH7NiOk9BQ, wuOiO7XYDgQ]
    equipment:
      - Janelas Finestra Car.
    processes:
      - Instalação das janelas na van.
  - system_id: solar-power
    title: Sistema elétrico fotovoltaico off-grid
    video_ids: [gJeIieF7oiY, 8Y2hkStLF14, WgPm5eI12Ls, tq5C4Fi2Brg, C28HvEzwIPk, L-FMpSbwU3M, wuOiO7XYDgQ, ZUPpQwlqrsg]
    equipment:
      - Rack artesanal para os painéis solares.
      - Uma bateria estacionária de chumbo-ácido Heliar Freedom DF4001 de 240 Ah.
      - Dois painéis solares Canadian Solar de 275 Wp cada, policristalinos.
      - Controlador de carga MPPT Epever TRIRON 3210N, 30 A, 12/24 V.
      - Inversor Hayonik de 500 W, entrada 12 V e saída 127 V, com pico de 1.000 W.
    materials:
      - Cabos PP na instalação elétrica.
      - Cantoneiras de aço galvanizado, parafusos, porcas e arruelas para o rack.
      - Selante PU para vedação das fixações no teto.
    tools:
      - Máquina de solda.
      - Esmerilhadeira.
      - Furadeira de bancada.
    technologies:
      - Energia solar fotovoltaica off-grid.
    processes:
      - Construção do suporte para os painéis solares.
      - Dimensionamento do consumo dos equipamentos em planilha.
      - Instalação elétrica da van.
    precautions:
      - O relato do rack alerta para o uso de ferramentas perigosas e de equipamentos de proteção individual.
      - A descrição da instalação elétrica desaconselha o uso frequente da ligação de emergência ao alternador.
  - system_id: plumbing
    title: Sistema hidráulico e água servida
    video_ids: [8Y2hkStLF14, nEwzvhLczJ8, EYaOv9tWOps, BC2eZ3QBvTU, TMszKJB0tSI, wuOiO7XYDgQ, -_VZvjJXmwc]
    equipment:
