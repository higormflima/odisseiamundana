    video_ids: [gJeIieF7oiY]
notes: >
  Consolidação preliminar dos títulos e descrições dos 45 vídeos e da única
  transcrição local disponível. A sequência completa inclui conteúdos
  complementares e outros veículos, discriminados no registro de revisão;
  sua presença na playlist não os torna etapas da construção da Iveco.
  A planilha original fornecida pelo proprietário registra 380 itens, com
  total histórico de 64.564,62 BRL, incluindo veículo, manutenção e demais
  categorias. Os três subtotais em main_costs são disjuntos e somam esse total;
  não representam apenas a conversão. Há lançamentos posteriores a julho de
  2019 e uma data aparentemente incorreta, preservados no original e
  discriminados na revisão. Não são preços atuais. Fotos de detalhes e
  comparações antes/depois permanecem ausentes por falta de evidência
  suficiente nesta etapa. A página principal foi aprovada para publicação pelo
  proprietário em 15/11/2026. Essa aprovação não constitui validação técnica
  das instalações. O ponto do mapa representa a cidade, não o endereço da garagem.
