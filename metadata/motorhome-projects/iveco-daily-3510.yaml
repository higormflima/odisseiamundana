# Fontes locais consolidadas; página principal aprovada pelo proprietário.
project_id: iveco-daily-3510
title: Construção do Motorhome Artesanal Iveco Daily 35.10
summary: >
  Construímos nosso motorhome artesanal em uma van Iveco Daily 35.10,
  na garagem de casa. Reunimos o planejamento, os sistemas e as decisões
  da montagem, com os vídeos da construção e conteúdos complementares.
vehicle_model: Iveco Daily 35.10
chassis: >
  Ano 1998. Motor 2.8 turbodiesel, potência de 103 cv e tração traseira.
  Entre-eixos de 3,30 m. Dimensões totais da van original, antes da conversão,
  informadas pelo proprietário: comprimento de 6,00 m, largura de 2,00 m e
  altura de 2,675 m. Não representam a altura do motorhome com equipamentos no teto.
build_location: São José dos Campos, São Paulo
representative_point:
  name: São José dos Campos, São Paulo
  coordinates:
    lat: -23.17889
    lng: -45.88694
build_period:
  start: "2018-12"
  end: "2019-07"
main_costs:
  - description: Veículo e despesas associadas
    amount: 16132.52
    currency: BRL
    unit: Subtotal dos 7 itens da categoria Veículo; não corresponde somente ao preço de compra da van.
  - description: Manutenção
    amount: 29161.23
    currency: BRL
    unit: Subtotal dos 151 itens da categoria Manutenção, incluindo lançamentos após o término da construção.
  - description: Demais categorias da planilha
    amount: 19270.87
    currency: BRL
    unit: Subtotal dos outros 222 itens; inclui sistemas, materiais, ferramentas e acessórios, não apenas uma categoria de conversão.
