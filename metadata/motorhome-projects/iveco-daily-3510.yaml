      - Cantoneiras, porcas rebite e parafusos.
      - Sobras de MDF dos móveis, utilizadas no estrado.
      - Espuma D33 com 8 cm de espessura, escolhida após testes na loja.
    processes:
      - Construção de uma estrutura de cama removível.
  - system_id: climate-control
    title: Climatizador Maxiclima Fusion
    video_ids: [Sj5SnDLPo_A, wuOiO7XYDgQ, aaZcWMbDNZo]
    equipment:
      - Climatizador Maxiclima Fusion.
    processes:
      - Instalação do climatizador e da bomba de água.
    precautions:
      - O relato de uso não descreve o equipamento como capaz de refrigerar toda a van fechada.
  - system_id: bathroom
    title: Banheiro
    video_ids: [ReYewD_68hE, fYhPvrB5Fbs, LcJMFLZUHP4, wuOiO7XYDgQ]
    materials:
      - Madeira pinus reaproveitada para a estrutura.
      - MDF de 6 mm no revestimento interno e de 3 mm no externo.
      - Plástico reaproveitado e selante PU.
    equipment:
      - Banheiro portátil Porta Potti.
    processes:
      - Construção da estrutura, revestimento e impermeabilização do banheiro.
    precautions:
      - A descrição informa que a especificação técnica do plástico reaproveitado não era conhecida.
  - system_id: furniture-interiors
    title: Móveis e revestimento interno
    video_ids: [qHJbU6IYn1I, lcmL0jd1fT4, bEbICB_8g1Y, wuOiO7XYDgQ]
    materials:
      - MDF de 15 mm nos móveis.
      - MDF branco de 3 mm no revestimento das paredes e do teto.
    equipment:
      - Pistões a gás de 100 N nas portas dos armários.
    tools:
      - Gabarito para furos em ângulo.
    processes:
      - Planejamento dos móveis a partir das dimensões dos equipamentos e do espaço da cama.
      - Montagem dos armários e instalação dos pistões a gás.
      - Revestimento das paredes e do teto.
  - system_id: kitchen
    title: Cozinha
    video_ids: [qHJbU6IYn1I, wuOiO7XYDgQ, Zjj-DIcmFCI]
    equipment:
      - Pia de inox.
      - Cooktop de duas bocas.
      - Frigobar convertido para 12 V.
  - system_id: cabin
    title: Reforma da cabine
    video_ids: [Egs9kjhoBcU]
    processes:
      - Reforma da cabine e instalação de bancos de couro, conforme o título e a abertura da descrição.
decisions:
  - solution: Construção artesanal da motorcasa.
    reason: Os preços dos motorhomes no Brasil motivaram a escolha pela montagem própria.
    system_id: planning
    video_ids: [qukRFG4Uxmw]
  - solution: Uso de mangueiras flexíveis na hidráulica.
    reason: Facilitar as curvas e evitar as quebras que preocupavam no uso de tubos rígidos.
    system_id: plumbing
    video_ids: [8Y2hkStLF14]
  - solution: Instalação de caixa de água servida Seaflo.
    reason: Após a construção da pia e do banheiro, a água servida não escoaria sozinha para o reservatório.
    system_id: plumbing
    video_ids: [nEwzvhLczJ8]
  - solution: Estrutura removível para a cama.
    reason: Permitir sua retirada durante a construção e em manutenções que exigissem mais espaço.
    system_id: bed
    video_ids: [D4As-ZLi1wU]
  - solution: Compra da pia, do frigobar e do cooktop antes do planejamento do armário da cozinha.
    reason: Usar as dimensões reais dos equipamentos no projeto dos móveis.
    system_id: furniture-interiors
    video_ids: [qHJbU6IYn1I]
  - solution: Uso de MDF branco de 3 mm nas paredes e no teto.
    reason: Esperávamos uma montagem mais rápida e prática com placas grandes.
    system_id: furniture-interiors
    video_ids: [bEbICB_8g1Y]
  - solution: Instalação do climatizador Maxiclima Fusion.
    reason: Buscávamos conforto para dormir com um investimento menor do que em ar-condicionado e sistema elétrico mais robusto.
    system_id: climate-control
    video_ids: [aaZcWMbDNZo]
tips:
  - description: Planejar os móveis considerando as dimensões dos equipamentos que ficarão embutidos.
    system_id: furniture-interiors
    video_ids: [qHJbU6IYn1I]
  - description: Testar as opções de espuma na loja, nas posições de uso, em vez de tratar uma densidade como ideal para todas as pessoas.
    system_id: bed
    video_ids: [MZ_rUN7TPPg]
  - description: Avaliar o custo e o tempo de manutenção do veículo-base, não somente seu preço de compra.
    system_id: planning
    video_ids: [CTWd2t3xvYA]
duration:
