journey_id: 20240208-mexico
title: México — Península de Yucatán e Caribe
summary: >
  Nossa viagem de carro pela Península de Yucatán, entre cenotes, ruínas
  maias, manguezais e as praias do Caribe mexicano.
dates:
  year: 2024
  month: 2
  start_date: 2024-02-09
  end_date: 2024-02-23
duration_days: 15
trip_card:
  overall_rating: 8
  ratings:
    nature: 10
    experiences: 8
    food: 6
    prices: 6
    infrastructure: 8
    accessibility: 9
    culture: 10
    safety: 7
geography:
  continents:
    - América do Norte
  countries:
    - México
  regions:
    - Península de Yucatán
    - Caribe mexicano
  destinations:
    - Cancún
    - Holbox
    - Valladolid
    - Suytun
    - Chichén Itzá
    - Río Lagartos
    - Las Coloradas
    - Bacalar
    - Mahahual
    - Tulum
    - Playa del Carmen
    - Punta Esmeralda
  representative_point:
    name: Cancún
    coordinates:
      lat: 21.17429
      lng: -86.84656
transport:
  car_rental:
    days: 14
    notes: >
      Alugamos o carro em Cancún. O resumo da viagem relata 9.800 pesos
      mexicanos por 14 dias, com taxas e seguro, e cerca de 1.300 km percorridos.
accommodation:
  - name: Hostel La Candelaria
    type: other
    notes: >
      Nossa base em Valladolid. Participamos de noites de comida típica
      e aproveitamos o café da manhã.
activities:
  - activity_id: cenotes
    name: Visitas a cenotes na região de Valladolid
    notes: Visitamos Suytun e outro cenote cujo nome não foi confirmado na transcrição.
  - activity_id: chichen-itza
    name: Visita a Chichén Itzá
  - activity_id: rio-lagartos
    name: Passeio de barco em Río Lagartos e Las Coloradas
    notes: Observamos crocodilos, aves e flamingos.
  - activity_id: bacalar
    name: Descanso à beira da Laguna Bacalar
    notes: >
      Ficamos na hospedagem junto à lagoa. Não fizemos os passeios
      ao Canal dos Piratas nem aos cenotes de Bacalar.
  - activity_id: mahahual-snorkeling
    name: Snorkel em Mahahual
    notes: >
      Observamos duas tartarugas durante o passeio. O encontro com
      animais não é garantido.
  - activity_id: caribbean-beaches
    name: Praias de Holbox, Mahahual, Tulum e Playa del Carmen
