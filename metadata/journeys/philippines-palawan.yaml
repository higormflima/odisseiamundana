journey_id: philippines-palawan
title: Duas semanas em Palawan
summary: >
  Um roteiro de cerca de duas semanas pelas Filipinas, com chegada por Manila
  e paradas em Puerto Princesa, Port Barton e El Nido, em Palawan.
dates:
  year: 2025
  month: 12
  start_date: 2025-12-01
