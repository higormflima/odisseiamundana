name: Validar projeto

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Validar metadados
        run: pnpm validate:metadata
      - name: Gerar website
        run: pnpm build
